name: Validate guide
on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'lib/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run validate && npm run build
