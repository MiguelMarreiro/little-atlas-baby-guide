name: Daily prices and evidence access
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-guide
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/update.mjs
      - run: node scripts/check-sources.mjs
      - run: node scripts/check-recalls.mjs
      - name: Record schedule activation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='data/status.json';const s=JSON.parse(fs.readFileSync(path));
          s.scheduler='active';s.schedule='07:23 UTC daily';s.workflowRunId=process.env.GITHUB_RUN_ID;
          s.trigger=process.env.GITHUB_EVENT_NAME;
          if(s.trigger==='schedule')s.lastScheduledCheckAt=s.lastRunAt;
          fs.writeFileSync(path,JSON.stringify(s,null,2)+'\n');
          JS
      - run: npm run validate && npm run build
      - name: Retain observations
        run: |
          git config user.name 'Little Atlas updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dist
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh prices and check status'
            git push
          fi
      - name: Deploy to Cloudflare Pages when connected
        if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
      - name: Verify the published snapshot
        if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          for delay in 1 3 7 15 25; do
            sleep "$delay"
            if curl --fail --silent --show-error --max-time 12 "https://${PAGES_PROJECT}.pages.dev/snapshot.json?run=${GITHUB_RUN_ID}" --output "$RUNNER_TEMP/served.json" && cmp -s dist/snapshot.json "$RUNNER_TEMP/served.json"; then
              echo 'The public site serves the validated snapshot.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo 'Public site did not serve the expected snapshot in time.' >&2
          exit 1
      - name: Save portable webpage
        uses: actions/upload-artifact@v4
        with:
          name: little-atlas-webpage
          path: dist/
          retention-days: 7
      - name: Report coverage gaps
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('data/status.json'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Price checks\n${s.counts?.succeeded||0} of ${s.counts?.attempted||0} succeeded.\n\nFailed checks preserve old timestamps. See the published Update status section.\n`);
          if(s.counts?.failed)console.log('::warning::Some retailers could not be checked; prior observations were retained.');
          JS
